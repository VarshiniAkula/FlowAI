<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowChat Widget</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
      }
      .chat {
        max-width: 520px;
        margin: 40px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        padding: 16px;
      }
      .messages {
        height: 360px;
        overflow: auto;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 10px;
        background: #fafafa;
      }
      .row {
        margin: 8px 0;
      }
      .you {
        text-align: right;
        color: #0f172a;
      }
      .bot {
        text-align: left;
        color: #1d4ed8;
      }
      form {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      input {
        flex: 1;
        padding: 10px;
      }
      button {
        padding: 10px 14px;
      }
    </style>
  </head>
  <body>
    <div class="chat">
      <h3>FlowChat</h3>
      <div class="messages" id="messages"></div>
      <form id="chat-form">
        <input id="text" placeholder="Type a message..." />
        <button type="submit">Send</button>
      </form>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const form = document.getElementById("chat-form");
      const textEl = document.getElementById("text");

      let flowId = null;
      let nodeId = null;
      let context = {};

      function addMsg(role, text) {
        const div = document.createElement("div");
        div.className = `row ${role}`;
        div.textContent = `${role === "you" ? "You" : "Bot"}: ${text}`;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const message = textEl.value.trim();
        if (!message) return;

        addMsg("you", message);
        textEl.value = "";

        const res = await fetch("http://127.0.0.1:8000/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            flow_id: flowId,
            node_id: nodeId,
            context,
          }),
        });

        const data = await res.json();
        flowId = data.flow_id;
        nodeId = data.node_id;
        context = data.context || {};

        addMsg("bot", data.reply);
      });
    </script>
  </body>
</html>
