# Supabase local config for FlowMind.
# Generated for Phase 1. Run `supabase start` from `flowmind/` to bring up
# a local stack matching production extensions.

project_id = "flowmind"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Extensions (vector, pgcrypto, pg_trgm) are enabled inline in
# supabase/migrations/0001_init.sql via `create extension if not exists`.

[functions.ingest-document]
verify_jwt = false
